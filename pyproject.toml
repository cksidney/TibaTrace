[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["backend/apps/*/migrations", "artifacts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/dawatrace/settings/*.py" = ["F403", "F405"]
# Pytest fixtures shared across test modules are imported by name, which ruff
# reads as a redefinition when a test takes the fixture as an argument.
"backend/tests/test_pos_dispensing_controls.py" = ["F811"]
"backend/tests/test_pos_payment_ledger.py" = ["F811"]

[tool.bandit]
exclude_dirs = ["backend/tests", "backend/apps/*/tests", "backend/apps/*/migrations"]
skips = ["B101"]
