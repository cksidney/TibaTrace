[pytest]
DJANGO_SETTINGS_MODULE = dawatrace.settings.test
python_files = test_*.py
testpaths = tests apps
addopts = -ra --strict-markers
markers =
    django_db: tests requiring Django database access
    fhir: FHIR R4 conformance and interoperability tests
    terminology: FHIR terminology model and operation tests
    infrastructure: crosswalk, background-processing, and storage tests
    security: tenant, authorization and document-security tests
