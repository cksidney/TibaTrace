        These were ModelViewSets: a generic PATCH could set a sales order's status,
        release a hold or mark a delivery without the service that enforces
        allocation, credit and proof-of-delivery rules. The HQ client only calls the
        actions, so the generic path was an unused second route to every control.

        Pricing is deliberately excluded -- see WritablePricingViewSet below.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this sales return authorization.
        required: true
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesReturnAuthorization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SalesReturnAuthorization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SalesReturnAuthorization'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReturnAuthorization'
          description: ''
