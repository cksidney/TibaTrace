    requirement_summary: "The platform must support unique patient identification linked to National Identity, passport, or birth certificate numbers and integrate with Kenya National Unique Patient Identifier (UPI) / AfyaYangu registry."
    expected_result: "Patient registration enforces unique identification with validation against national format rules and prevents duplicate records."
    solution_category: "Clinical & Administrative"
    applicability_to_tibatrace: "APPLICABLE"
    applicability_rationale: "TibaTrace manages patient records for clinical dispensing, prescription tracking, and insurance claims."
