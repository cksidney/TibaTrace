# Signed Windows installer for the TibaTrace POS terminal.
#
# Separate from ci.yml on purpose. CI builds an unsigned package on every push;
# this produces the artefact a pharmacy actually installs, and it touches a code
# signing certificate. Those want different triggers and different review.
#
# The certificate never exists on disk outside the runner's own temporary
# directory, is never echoed, and is deleted in a step that runs even when the
# build fails.
#
# Distribution model: managed device. The signing certificate is Esenai Group's
# own, not a public CA's, so a machine that has never met it will not trust the
# signature. That is a distribution problem, not a signing failure, and the two
# are recorded separately throughout this workflow: `cryptographically_signed`
# and `publicly_trusted` are different questions with different answers.

name: Windows release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the installer (requires the signing secrets)"
        type: boolean
        default: true
  push:
    tags:
      - "pos-windows-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace @dawatrace/shared

      # The gates the installer should not be built past. A signed installer of
      # a broken build is worse than no installer: it carries the publisher's
      # name and installs without a warning.
      - name: Typecheck
        run: npm run typecheck --workspace @dawatrace/pos-windows

      - name: Unit tests
        run: npm run test --workspace @dawatrace/pos-windows

      - name: Decode signing certificate
        id: cert
        if: github.event_name != 'workflow_dispatch' || inputs.sign
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            Write-Error "WINDOWS_SIGNING_PFX_BASE64 is not set. Run with sign=false to produce an unsigned build."
            exit 1
          }
          # RUNNER_TEMP only. It is outside the workspace, so it cannot be picked
          # up by a checkout, an artifact upload or a stray `git add`.
          $pfx = Join-Path $env:RUNNER_TEMP 'tibatrace-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          # The path is written to the step output; the contents never are.
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          Write-Host "Certificate decoded to the runner temp directory."

      - name: Build signed installer
        if: github.event_name != 'workflow_dispatch' || inputs.sign
        shell: pwsh
        env:
          # electron-builder reads the certificate from these two variables.
          # GitHub masks secrets in logs, and neither is ever echoed here.
          CSC_LINK: ${{ steps.cert.outputs.pfx }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          # Fail rather than quietly producing an unsigned file. A build that
          # silently skips signing is how an unsigned installer reaches a till.
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: npm run dist:win --workspace @dawatrace/pos-windows

      - name: Build unsigned installer
        if: github.event_name == 'workflow_dispatch' && !inputs.sign
        run: npm run dist:win --workspace @dawatrace/pos-windows

      - name: Remove signing certificate
        # always(): the certificate must not survive a failed build. Everything
        # after this point works from the signature embedded in the installer,
        # which carries the public certificate and no key material.
        if: always()
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'tibatrace-signing.pfx'
          if (Test-Path $pfx) {
            Remove-Item $pfx -Force
            Write-Host "Signing certificate removed from the runner."
          }

      - name: Verify Authenticode signature
        id: verify
        if: github.event_name != 'workflow_dispatch' || inputs.sign
        shell: pwsh
        run: |
          $exe = 'apps/pos-windows/release/TibaTrace-POS-Setup-1.0.0.exe'
          if (-not (Test-Path $exe)) { Write-Error "Installer not found at $exe"; exit 1 }

          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Get-AuthenticodeSignature status : $($sig.Status)"
          Write-Host "Status message                   : $($sig.StatusMessage)"

          # Question one: is the file signed at all, and by whom? This is about
          # the file, and no certificate store anywhere affects the answer.
          if ($null -eq $sig.SignerCertificate) {
            Write-Error "The installer carries no Authenticode signature. Signing did not happen."
            exit 1
          }
          if ($sig.Status -eq 'HashMismatch' -or $sig.Status -eq 'NotSigned') {
            Write-Error "Signature status is $($sig.Status). The file is not validly signed."
            exit 1
          }

          $cert = $sig.SignerCertificate
          $sha256 = ([Security.Cryptography.SHA256]::Create().ComputeHash($cert.RawData) | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "Signer subject                   : $($cert.Subject)"
          Write-Host "Signer issuer                    : $($cert.Issuer)"
          Write-Host "Signer SHA-256                   : $sha256"
          Write-Host "Signer SHA-1 (thumbprint)        : $($cert.Thumbprint)"
          Write-Host "Valid from                       : $($cert.NotBefore.ToString('u'))"
          Write-Host "Valid to                         : $($cert.NotAfter.ToString('u'))"

          # An unstamped signature expires with the certificate, including on
          # copies already installed on tills. Non-negotiable.
          if (-not $sig.TimeStamperCertificate) { Write-Error "Installer is not timestamped."; exit 1 }
          Write-Host "Timestamp authority              : $($sig.TimeStamperCertificate.Subject)"

          # Question two, and a different one: will a machine that has never met
          # this certificate trust the signature? For a self-signed certificate
          # the answer is no until the public certificate is enrolled. That is
          # what the managed-install package exists to do, so it is recorded --
          # not treated as a signing failure.
          $publiclyTrusted = 'false'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found on the runner; signature not independently verified."; exit 1 }

          # GitHub runs pwsh steps with $ErrorActionPreference = 'Stop'. A native
          # command's stderr, redirected into the success stream, can surface as
          # a terminating error under that setting -- and an untrusted root is
          # reported on stderr, so the one case this step exists to handle is
          # exactly the one that would blow up. Relax it for the call only.
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $out = (& $signtool.FullName verify /pa /v $exe 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          Write-Host $out
          if ($code -eq 0) {
            $publiclyTrusted = 'true'
            Write-Host "signtool: the chain is trusted by the public root store on this runner."
          } else {
            # Classify the failure by building the chain, not by matching
            # signtool's prose. signtool wraps its message -- it prints
            # "terminated in a root\n\tcertificate which is not trusted" -- so a
            # match on the phrase fails on the one case this branch exists for.
            # X509Chain answers the same question as a flag, in no language.
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.RevocationMode = 'NoCheck'
            $null = $chain.Build($cert)
            $flags = @()
            foreach ($element in $chain.ChainStatus) { $flags += ($element.Status.ToString() -split ',\s*') }
            $flags = @($flags | Where-Object { $_ -and $_ -ne 'NoError' } | Select-Object -Unique)
            Write-Host "Chain status                     : $(if ($flags) { $flags -join ', ' } else { '(none)' })"

            # The one acceptable reason to fail: the chain ends at a root this
            # machine has not been told to trust. Anything else -- expired,
            # tampered, revoked, wrong usage -- is a real signing problem.
            $tolerated = @('UntrustedRoot', 'PartialChain')
            $unexpected = @($flags | Where-Object { $tolerated -notcontains $_ })
            if ($flags.Count -eq 0) {
              Write-Error "signtool verify failed but the certificate chain builds cleanly. The failure is not an untrusted root, so it is a real signing problem."
              exit 1
            }
            if ($unexpected.Count -gt 0) {
              Write-Error "Certificate chain has problems beyond an untrusted root: $($unexpected -join ', '). This is a real signing problem."
              exit 1
            }
            Write-Host "::notice::Signature is valid; its root is not publicly trusted ($($flags -join ', ')). Expected for the Esenai self-signed certificate. Distribution is via the managed-install package, which enrols the public certificate on the device."
          }

          # This runner has not enrolled the certificate, so a non-Valid status
          # here is the clean-environment baseline the install test relies on.
          "signed=true" >> $env:GITHUB_OUTPUT
          "publicly_trusted=$publiclyTrusted" >> $env:GITHUB_OUTPUT
          "signer_sha256=$sha256" >> $env:GITHUB_OUTPUT
          "signer_subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          "pre_enrolment_status=$($sig.Status)" >> $env:GITHUB_OUTPUT
          "timestamped=true" >> $env:GITHUB_OUTPUT

          # signtool's non-zero exit is still sitting in $LASTEXITCODE, and the
          # wrapper GitHub appends to every pwsh step ends with `exit $LASTEXITCODE`.
          # Without this the step fails on an outcome it just decided was fine.
          exit 0

      - name: Export the public signing certificate
        id: export
        if: steps.verify.outputs.signed == 'true'
        shell: pwsh
        run: |
          # Taken from the signature on the installer, not from the PFX -- which
          # was deleted two steps ago and is never reopened. X509ContentType::Cert
          # is the DER public certificate: it can verify a signature and cannot
          # create one. There is no code path here that can emit a private key.
          $exe = 'apps/pos-windows/release/TibaTrace-POS-Setup-1.0.0.exe'
          $cer = 'apps/pos-windows/release/tibatrace-windows-signing.cer'
          $cert = (Get-AuthenticodeSignature $exe).SignerCertificate
          [IO.File]::WriteAllBytes($cer, $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          # Read it back as a stranger would, and prove what was written.
          $roundTrip = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path $cer).Path)
          if ($roundTrip.HasPrivateKey) {
            Remove-Item $cer -Force
            Write-Error "The exported certificate contains a private key. Refusing to publish it."
            exit 1
          }
          $sha256 = ([Security.Cryptography.SHA256]::Create().ComputeHash($roundTrip.RawData) | ForEach-Object { $_.ToString('x2') }) -join ''
          if ($sha256 -ne '${{ steps.verify.outputs.signer_sha256 }}') {
            Write-Error "Exported certificate does not match the installer signer."
            exit 1
          }
          Write-Host "Exported public certificate (no private key)."
          Write-Host "  subject  : $($roundTrip.Subject)"
          Write-Host "  SHA-256  : $sha256"
          Write-Host "  bytes    : $((Get-Item $cer).Length)"
          "cert_sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Generate checksums and release manifest
        # always(): a failed verification is exactly when somebody needs the
        # checksum and the manifest, because the manifest is where the signature
        # state gets recorded.
        if: always()
        shell: pwsh
        run: |
          Set-Location apps/pos-windows/release
          $exe = 'TibaTrace-POS-Setup-1.0.0.exe'
          if (-not (Test-Path $exe)) { Write-Host "No installer was produced; nothing to record."; exit 0 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          # sha256sum-compatible, so `sha256sum -c` verifies it unchanged.
          "$hash  $exe" | Out-File -Encoding ascii SHA256SUMS.txt

          $signed = '${{ steps.verify.outputs.signed }}' -eq 'true'
          $trusted = '${{ steps.verify.outputs.publicly_trusted }}' -eq 'true'
          $certSha = '${{ steps.export.outputs.cert_sha256 }}'

          $manifest = [ordered]@{
            product      = 'TibaTrace POS'
            app_id       = 'com.esenai.tibatrace.pos'
            publisher    = 'Esenai Group Ltd'
            version      = '1.0.0'
            architecture = 'x64'
            installer    = $exe
            sha256       = $hash
            size_bytes   = (Get-Item $exe).Length

            # Two separate facts. The installer carries a real signature made
            # with a key only Esenai holds; that signature is not chained to a
            # public CA, so an un-enrolled machine will not accept it. Collapsing
            # these into one `signed` flag is what made an earlier run report a
            # correctly signed installer as a failure.
            cryptographically_signed = $signed
            publicly_trusted = $trusted
            distribution_model = 'managed_device'
            certificate_enrolment_required = (-not $trusted)

            signer = '${{ steps.verify.outputs.signer_subject }}'
            signing_certificate_sha256 = $certSha
            signing_certificate_file = 'tibatrace-windows-signing.cer'
            timestamped = ('${{ steps.verify.outputs.timestamped }}' -eq 'true')
            signature_status_before_enrolment = '${{ steps.verify.outputs.pre_enrolment_status }}'

            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            built_at = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json -Depth 3 | Out-File -Encoding utf8 release-manifest.json

          Get-Content SHA256SUMS.txt
          Get-Content release-manifest.json

      - name: Assemble the managed installation package
        id: package
        if: steps.export.outputs.cert_sha256 != ''
        shell: pwsh
        run: |
          $release = 'apps/pos-windows/release'
          $stage = Join-Path $env:RUNNER_TEMP 'managed-install'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          Copy-Item "$release/TibaTrace-POS-Setup-1.0.0.exe" $stage
          Copy-Item "$release/tibatrace-windows-signing.cer" $stage
          Copy-Item "$release/release-manifest.json" $stage
          Copy-Item 'apps/pos-windows/managed-install/INSTALLATION-GUIDE.md' $stage

          # The pinned thumbprint is baked in at package time, from the
          # certificate that actually signed this installer. The script must not
          # read its expectation out of the folder it is checking -- that would
          # verify nothing.
          $installScript = Get-Content -Raw 'apps/pos-windows/managed-install/Install-TibaTrace.ps1'
          $pin = '${{ steps.export.outputs.cert_sha256 }}'
          $installScript = $installScript.Replace('__PINNED_CERT_SHA256__', $pin)
          if ($installScript -match '__PINNED_CERT_SHA256__') {
            Write-Error "Placeholder still present after injection."
            exit 1
          }
          # ASCII: the guide tells operators to run this under Windows PowerShell
          # 5.1, which reads a BOM-less UTF-8 file as ANSI. The script has no
          # non-ASCII characters, so the two readings are identical.
          Set-Content -Path (Join-Path $stage 'Install-TibaTrace.ps1') -Value $installScript -Encoding ascii
          Write-Host "Pinned certificate SHA-256 into the installer script: $pin"

          # Checksums over every file the package ships, so a partial or altered
          # extraction is detectable without trusting the ZIP container.
          Set-Location $stage
          $lines = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

          $zip = Join-Path $env:RUNNER_TEMP 'TibaTrace-POS-Managed-Install-1.0.0.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # CreateFromDirectory rather than Compress-Archive: the installer is
          # ~100 MB and Compress-Archive is pathologically slow at that size.
          # Already loaded under pwsh 7; the load is a no-op there and only
          # matters if this ever runs under Windows PowerShell.
          Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "Built $zip"
          Write-Host "  size   : $((Get-Item $zip).Length) bytes"
          Write-Host "  sha256 : $zipHash"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Install on a clean Windows environment
        if: steps.package.outputs.zip != ''
        shell: pwsh
        run: |
          # This runner is a fresh windows-latest image that has never seen the
          # Esenai certificate -- the untrusted-root result from the verify step
          # above is the proof. So it is the clean environment the managed
          # package is meant for, and the sequence below is the real thing:
          # verify fails, enrol, verify passes, install.
          $work = Join-Path $env:RUNNER_TEMP 'clean-test'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          # Already loaded under pwsh 7; the load is a no-op there and only
          # matters if this ever runs under Windows PowerShell.
          Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::ExtractToDirectory('${{ steps.package.outputs.zip }}', $work)
          Write-Host "Extracted the published ZIP to $work"
          Get-ChildItem $work | Format-Table Name, Length | Out-String | Write-Host

          $exe = Join-Path $work 'TibaTrace-POS-Setup-1.0.0.exe'
          $pin = '${{ steps.export.outputs.cert_sha256 }}'

          Write-Host "--- BEFORE ENROLMENT ---------------------------------------------"
          $before = Get-AuthenticodeSignature $exe
          Write-Host "Get-AuthenticodeSignature Status : $($before.Status)"
          Write-Host "StatusMessage                    : $($before.StatusMessage)"
          Write-Host "SignerCertificate                : $($before.SignerCertificate.Subject)"
          $inRoot = Get-ChildItem Cert:\LocalMachine\Root | Where-Object {
            (([Security.Cryptography.SHA256]::Create().ComputeHash($_.RawData) | ForEach-Object { $_.ToString('x2') }) -join '') -eq $pin }
          if ($inRoot) { Write-Error "The certificate is already in the machine root store; this is not a clean environment and the test would prove nothing."; exit 1 }
          Write-Host "Certificate is NOT in LocalMachine\Root: environment is clean."
          if ($before.Status -eq 'Valid') { Write-Error "Signature already reports Valid before enrolment. Baseline is wrong."; exit 1 }
          Write-Host "Confirmed: verification does not pass before enrolment."

          Write-Host "--- ENROLMENT AND INSTALL ----------------------------------------"
          & powershell -ExecutionPolicy Bypass -File (Join-Path $work 'Install-TibaTrace.ps1')
          if ($LASTEXITCODE -ne 0) { Write-Error "Install-TibaTrace.ps1 exited with $LASTEXITCODE."; exit 1 }

          Write-Host "--- AFTER ENROLMENT ----------------------------------------------"
          $after = Get-AuthenticodeSignature $exe
          Write-Host "Get-AuthenticodeSignature Status : $($after.Status)"
          if ($after.Status -ne 'Valid') { Write-Error "Signature is $($after.Status) after enrolment; expected Valid."; exit 1 }
          Write-Host "Confirmed: Get-AuthenticodeSignature returns Valid."

          foreach ($store in 'TrustedPeople', 'Root') {
            $found = Get-ChildItem "Cert:\LocalMachine\$store" | Where-Object {
              (([Security.Cryptography.SHA256]::Create().ComputeHash($_.RawData) | ForEach-Object { $_.ToString('x2') }) -join '') -eq $pin }
            if (-not $found) { Write-Error "Certificate missing from LocalMachine\$store after enrolment."; exit 1 }
            Write-Host "Enrolled in LocalMachine\$store : $($found.Subject)"
          }

          Write-Host "--- INSTALLED APPLICATION ----------------------------------------"
          # Two independent checks: the payload on disk, and what Windows itself
          # believes is installed. Either alone can be satisfied by a half-run
          # installer.
          $appExe = Join-Path $env:ProgramFiles 'TibaTrace POS\TibaTrace POS.exe'
          if (-not (Test-Path $appExe)) {
            Write-Host "Not at the default path; searching Program Files."
            $found = Get-ChildItem $env:ProgramFiles -Recurse -Filter 'TibaTrace POS.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            $appExe = if ($found) { $found.FullName } else { $null }
          }
          if (-not $appExe) { Write-Error "TibaTrace POS.exe was not installed."; exit 1 }
          $item = Get-Item $appExe
          Write-Host "Installed binary : $($item.FullName)"
          Write-Host "Size             : $($item.Length) bytes"
          Write-Host "Version          : $($item.VersionInfo.ProductVersion)"

          $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $entry = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*TibaTrace*' } | Select-Object -First 1
          if (-not $entry) { Write-Error "No uninstall entry registered; Windows does not consider TibaTrace POS installed."; exit 1 }
          Write-Host "Registered as    : $($entry.DisplayName) $($entry.DisplayVersion)"
          Write-Host "Publisher        : $($entry.Publisher)"
          Write-Host "Install location : $($entry.InstallLocation)"

          Write-Host "Clean-environment test passed: untrusted before enrolment, Valid after, application installed."
          exit 0

      - name: Upload managed installation package
        if: steps.package.outputs.zip != ''
        uses: actions/upload-artifact@v4
        with:
          name: tibatrace-pos-managed-install
          path: ${{ steps.package.outputs.zip }}
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tibatrace-pos-windows-installer
          path: |
            apps/pos-windows/release/TibaTrace-POS-Setup-1.0.0.exe
            apps/pos-windows/release/tibatrace-windows-signing.cer
            apps/pos-windows/release/SHA256SUMS.txt
            apps/pos-windows/release/release-manifest.json
          retention-days: 90
          if-no-files-found: error
