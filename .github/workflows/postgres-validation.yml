name: PostgreSQL release validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable release tag or full commit to validate"
        required: true
        type: string
      expected_sha:
        description: "Expected full source commit; mismatches fail closed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  postgres-business:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tibatrace_release_validation
          POSTGRES_USER: tibatrace_validation
          POSTGRES_PASSWORD: ci-disposable-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tibatrace_validation -d tibatrace_release_validation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: dawatrace.settings.test
      DAWATRACE_DATABASE_URL: postgresql://tibatrace_validation:ci-disposable-postgres-only@127.0.0.1:5432/tibatrace_release_validation
      DAWATRACE_SECRET_KEY: postgres-validation-only-not-a-production-secret-key
      DAWATRACE_REDIS_URL: locmem://
      DAWATRACE_CELERY_TASK_ALWAYS_EAGER: "true"
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install pinned backend dependencies
        run: pip install -r backend/requirements.lock -r backend/requirements-dev.lock
      - name: Assert exact source and real PostgreSQL connection
        working-directory: backend
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p ../postgres-evidence
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", "SQLite is not a PostgreSQL validation gate"
          with connection.cursor() as cursor:
              cursor.execute("SELECT version()")
              version = cursor.fetchone()[0]
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["EXPECTED_SOURCE_SHA"]
          Path("../postgres-evidence/source-database.json").write_text(json.dumps({"source_sha": source, "database_vendor": connection.vendor, "database_version": version}, indent=2))
          PY
      - name: PostgreSQL migrations and full business suite
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
          python -m pytest -q --tb=short --junitxml=../postgres-evidence/backend-postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-release-business-evidence
          path: postgres-evidence
