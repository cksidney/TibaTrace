name: PostgreSQL release validation

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable release tag or full commit to validate"
        required: true
        type: string
      expected_sha:
        description: "Expected full source commit; mismatches fail closed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recovery-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r backend/requirements.lock
      - name: Install production-major PostgreSQL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
      - name: Synthetic coordinated recovery without production configuration
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python scripts/dpia_recovery_rehearsal.py --postgres-bin /usr/lib/postgresql/16/bin \
            --expected-major 16 --output "$RUNNER_TEMP/tibatrace-recovery-rehearsal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-recovery-rehearsal-pg16
          # Never upload generated seeds, archive keys, database dumps or objects.
          path: ${{ runner.temp }}/tibatrace-recovery-rehearsal/REPORT.json
          if-no-files-found: error
  postgres-business:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        # Production VPS is PostgreSQL 16; validate its major version directly.
        # Exact server/version evidence is still captured below.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tibatrace_release_validation
          POSTGRES_USER: tibatrace_validation
          POSTGRES_PASSWORD: ci-disposable-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tibatrace_validation -d tibatrace_release_validation"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: dawatrace.settings.test
      DAWATRACE_DATABASE_URL: postgresql://tibatrace_validation:ci-disposable-postgres-only@127.0.0.1:5432/tibatrace_release_validation
      DAWATRACE_SECRET_KEY: postgres-validation-only-not-a-production-secret-key
      DAWATRACE_REDIS_URL: locmem://
      DAWATRACE_CELERY_TASK_ALWAYS_EAGER: "true"
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
      BUSINESS_SHARD_COUNT: "8"
      BUSINESS_SHARD_INDEX: ${{ matrix.shard }}
      BUSINESS_SHARD_DATABASE: postgresql
      BUSINESS_SHARD_EVIDENCE: ../postgres-evidence/partition-selection.json
      BUSINESS_SHARD_REPORT: backend-postgres.xml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install pinned backend dependencies
        run: pip install -r backend/requirements.lock -r backend/requirements-dev.lock
      - name: Assert exact source and real PostgreSQL connection
        working-directory: backend
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p ../postgres-evidence
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", "SQLite is not a PostgreSQL validation gate"
          with connection.cursor() as cursor:
              cursor.execute("SELECT version()")
              version = cursor.fetchone()[0]
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["EXPECTED_SOURCE_SHA"]
          Path("../postgres-evidence/source-database.json").write_text(json.dumps({"source_sha": source, "database_vendor": connection.vendor, "database_version": version}, indent=2))
          PY
      - name: PostgreSQL migrations and full business suite
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py audit_clinical_lookup_safety
          python manage.py migrate --noinput
          python manage.py migrate --check
          python -m pytest -p tests.business_shard_plugin -q --tb=short --junitxml=../postgres-evidence/backend-postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-release-business-evidence-${{ matrix.shard }}
          path: postgres-evidence
  postgres-coverage:
    needs: postgres-business
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: postgres-release-business-evidence-*
          path: business-evidence
      - name: Verify complete exact-source PostgreSQL coverage
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/verify_business_shards.py business-evidence --database postgresql --shards 8 --expected-sha "$EXPECTED_SOURCE_SHA"
