name: DawaTrace CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      container_preflight:
        description: "Only container/security and application gates; never publishes or deploys"
        required: false
        default: false
        type: boolean
      update_visual_baselines:
        description: "Capture reviewed Linux visual baselines as a CI artifact"
        required: false
        default: false
        type: boolean
      postgres_source_ref:
        description: "Run only the real PostgreSQL gate against this immutable release ref"
        required: false
        default: ""
        type: string
      postgres_expected_sha:
        description: "Expected full source SHA for PostgreSQL-only validation"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  postgres-release:
    if: ${{ !inputs.container_preflight }}
    uses: ./.github/workflows/postgres-validation.yml
    with:
      source_ref: ${{ inputs.postgres_source_ref || github.sha }}
      expected_sha: ${{ inputs.postgres_expected_sha || github.sha }}
  backend:
    if: ${{ !inputs.postgres_source_ref && !inputs.container_preflight }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: dawatrace.settings.test
      DAWATRACE_DATABASE_URL: "sqlite:///:memory:"
      DAWATRACE_SECRET_KEY: ci-only-secret
      DAWATRACE_OBJECT_SIGNING_KEY: ci-object-signing-key
      DAWATRACE_REDIS_URL: redis://127.0.0.1:6379/0
      DAWATRACE_CELERY_TASK_ALWAYS_EAGER: "true"
      DAWATRACE_RUN_ONLINE_AUDIT: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: pip install -r requirements.lock -r requirements-dev.lock
      - run: mkdir -p ../artifacts/generated/tests ../artifacts/generated/security
      - run: ../scripts/validate_repository.sh --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dawatrace-backend-evidence
          path: artifacts/generated

  docker:
    if: ${{ !inputs.postgres_source_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file docker/backend.Dockerfile --build-arg GIT_SHA=${{ github.sha }} --tag dawatrace/backend:ci .
      - run: docker build --file apps/hq-web/Dockerfile --build-arg SOURCE_REVISION=${{ github.sha }} --tag dawatrace/hq:ci .
      - run: docker image inspect dawatrace/backend:ci
      - name: Container scan gate
        run: |
          bash scripts/scan_release_image.sh dawatrace/backend:ci artifacts/container-security/backend.json '${{ github.sha }}' backend
          bash scripts/scan_release_image.sh dawatrace/hq:ci artifacts/container-security/hq.json '${{ github.sha }}' hq
      - name: Minimal runtime compatibility smoke
        run: |
          docker run --rm -e DJANGO_SETTINGS_MODULE=dawatrace.settings.test \
            -e DAWATRACE_DATABASE_URL=sqlite:////tmp/tibatrace-container-preflight.sqlite3 \
            -e DAWATRACE_SECRET_KEY=container-preflight-only dawatrace/backend:ci \
            sh -c 'python -c "import psycopg, cryptography, qrcode, apps.platform.reporting.pdf; print(\"runtime imports passed\")" && python manage.py check && python manage.py migrate --noinput && python manage.py migrate --check'
          docker run -d --name hq-preflight -p 18080:8080 dawatrace/hq:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-evidence
          path: artifacts/container-security

  shared:
    if: ${{ !inputs.postgres_source_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check_npm_audit.mjs
      # HQ and both POS clients resolve shared-package subpaths from dist.
      # Build it explicitly so this gate verifies a clean checkout rather
      # than accidentally relying on a developer's retained build output.
      - run: npm run build --workspace @dawatrace/shared
      - run: npm run typecheck
      - run: npm run build
      - run: npm test --workspaces --if-present

  visual:
    if: ${{ !inputs.postgres_source_ref && !inputs.container_preflight }}
    # Visual baselines are platform-specific: font rasterisation and subpixel
    # rendering differ enough between macOS, Windows and Linux that a baseline
    # captured on one fails on another for reasons unrelated to the code.
    # This job is the only authority for them. Baselines captured anywhere else
    # must not be committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @dawatrace/shared
      - run: npm run typecheck:visual --workspace @dawatrace/pos-windows
      - run: npx playwright install --with-deps chromium
        working-directory: apps/pos-windows
      - name: Run visual regression suite
        run: |
          if [ "${{ inputs.update_visual_baselines }}" = "true" ]; then
            npx playwright test --project=console-1280 --workers=1 --update-snapshots
            npx playwright test --project=console-1024 --workers=1 --update-snapshots
          else
            npm run visual --workspace @dawatrace/pos-windows
          fi
        working-directory: apps/pos-windows
      - uses: actions/upload-artifact@v4
        if: success() && inputs.update_visual_baselines
        with:
          name: visual-regression-baselines
          path: apps/pos-windows/visual/__screenshots__/linux
          retention-days: 14
      - uses: actions/upload-artifact@v4
        # The diff images are the evidence. Without them a failure here is just
        # a red cross, and a red cross with no picture gets waved through.
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            apps/pos-windows/test-results
            apps/pos-windows/playwright-report
          retention-days: 14

  pos-windows:
    if: ${{ !inputs.postgres_source_ref }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build --workspace @dawatrace/shared
      - run: npm run typecheck --workspace @dawatrace/pos-windows
      - run: npm run test --workspace @dawatrace/pos-windows
      - run: npm run package:windows --workspace @dawatrace/pos-windows
      - uses: actions/upload-artifact@v4
        with:
          name: tibatrace-pos-windows-unsigned-msix
          path: apps/pos-windows/release

  pos-android:
    if: ${{ !inputs.postgres_source_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @dawatrace/shared
      - run: npm run typecheck --workspace @dawatrace/pos-android
      - run: npm run test --workspace @dawatrace/pos-android
      - run: npm run android:assemble:debug --workspace @dawatrace/pos-android
        env:
          NODE_BINARY: node
      - uses: actions/upload-artifact@v4
        with:
          name: tibatrace-pos-android-debug
          path: apps/pos-android/android/app/build/outputs/apk/debug
